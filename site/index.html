<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时更新</title>
<meta name="description" content="京东实时优惠线报，每小时自动更新，复制文案即可发单">
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#23262b;--sub:#9aa0a8;--line:#eef0f4;
--jd:#E12319;--tb:#ff5000;--fz:#ff8f1f;--brand:#3C4BEE;--shadow:0 10px 30px 0 rgba(17,55,178,.09)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{text-decoration:none}

/* ---------- 顶部栏（无 banner） ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
box-shadow:0 2px 8px rgba(17,55,178,.04)}
.topbar-inner{max-width:1230px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px;
background:linear-gradient(90deg,#FF7D00,#FF0A00);-webkit-background-clip:text;background-clip:text;
color:transparent;white-space:nowrap}
.logo small{display:inline-block;font-size:10px;font-weight:500;color:#c3c8d0;
-webkit-text-fill-color:#c3c8d0;margin-left:6px;letter-spacing:1px}
@media(max-width:640px){.topbar-inner{padding:8px 12px;gap:10px}}

/* ---------- 筛选 / 实时条 ---------- */
.wrap{max-width:1230px;margin:0 auto;padding:14px 20px 40px}
.screen{background:#fff;border:1px solid #E7EDF9;border-radius:14px;padding:12px 18px;
box-shadow:0 2px 10px rgba(17,55,178,.05)}
.screen-item{display:flex;align-items:center;flex-wrap:wrap;gap:14px;min-height:44px}
.screen-item .title{font-size:14px;color:#8a909c;margin-right:2px;font-weight:500;letter-spacing:.5px}
.screen-item ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.screen-item ul li{font-size:16px;font-weight:500;letter-spacing:1px;color:#5a6270;cursor:pointer;
padding:7px 26px;border-radius:999px;transition:.18s;border:1px solid #E3E8F2;background:#fff}
.screen-item ul li:hover{color:var(--brand);border-color:#B9C6F2;background:#F5F8FF}
.screen-item ul li.active{background:var(--brand);color:#fff;font-weight:600;border-color:var(--brand);
box-shadow:0 4px 12px rgba(60,75,238,.28)}

/* ---------- 关键词搜索（筛选行右侧） ---------- */
.srch{margin-left:auto;display:flex;align-items:center;position:relative}
.srch input{width:280px;height:40px;padding:0 78px 0 16px;background:#FAFBFF;
border:1px solid #E0E6F2;border-radius:999px;outline:none;font-size:14px;color:#333;transition:.18s}
.srch input::placeholder{color:#aab1bd}
.srch input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(60,75,238,.1)}
.srch .sbtn{position:absolute;right:4px;top:4px;height:32px;padding:0 18px;border:0;
border-radius:999px;background:var(--brand);color:#fff;font-size:13px;font-weight:500;cursor:pointer;
transition:.18s}
.srch .sbtn:hover{background:#2f3ddb;box-shadow:0 3px 10px rgba(60,75,238,.3)}
@media(max-width:780px){.srch{margin-left:0;width:100%}.srch input{width:100%}}
/* ---------- 双11福利清单子标签（仅点「双11福利清单」tab 时显示） ---------- */
.wfwrap{display:none;flex-wrap:wrap;gap:10px;margin:14px 0 4px;background:#fff;
padding:12px 18px;border:1px solid #EBEFF7;border-radius:14px;box-shadow:0 2px 10px rgba(17,55,178,.05)}
.wfwrap span{font-size:14px;color:#5a6270;cursor:pointer;padding:7px 20px;border-radius:999px;
border:1px solid #E3E8F2;background:#fff;transition:.18s;user-select:none;white-space:nowrap}
.wfwrap span:hover{color:var(--brand);border-color:#B9C6F2;background:#F5F8FF}
.wfwrap span.active{background:var(--brand);color:#fff;font-weight:600;border-color:var(--brand);
box-shadow:0 4px 12px rgba(60,75,238,.28)}
.wf-title{font-size:14px;font-weight:600;color:#222;line-height:1.45;margin-bottom:6px;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wf-coupon{display:inline-block;font-size:12px;color:#E12319;border:1px solid #FFC9C4;
background:#FFF7F6;border-radius:4px;padding:1px 8px}
.wf-tpwd{font-size:12px;color:#8a909c;margin-top:5px;cursor:pointer;user-select:all}
.wf-tpwd:hover{color:var(--brand)}

/* ---------- 红包弹层（仿好单库大红包卡，每会话各平台弹一次） ---------- */
#rpMask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:97;
display:none;align-items:center;justify-content:center}
#rpMask.show{display:flex}
#rpBox{width:300px;max-width:86vw;max-height:88vh;border-radius:22px;overflow:hidden;overflow-y:auto;position:relative;
text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35);background:#E02020;-webkit-overflow-scrolling:touch}
.rp-img{display:block;width:100%;height:auto;max-height:66vh;object-fit:contain;margin:0 auto}
.rp-body{background:linear-gradient(165deg,#FF6A45,#E02020 55%,#C51610);padding:30px 18px 18px;color:#fff}
.rp-body.rp-jd{background:linear-gradient(165deg,#FF5A45,#E1251B 55%,#A31414)}
.rp-brand{font-size:13px;letter-spacing:3px;opacity:.92}
.rp-big{font-size:30px;font-weight:800;color:#FFE14D;letter-spacing:2px;
margin:8px 0 2px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.rp-sub1{font-size:17px;font-weight:600}
.rp-sub1 b{color:#FFE14D;font-size:24px}
.rp-pic-wrap{position:relative;line-height:0}
.rp-open{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:84px;height:84px;
border-radius:50%;cursor:pointer;line-height:1;
background:radial-gradient(circle at 35% 30%,#FFF3C9,#FFC53D 70%,#F5A623);
color:#B01F14;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;
border:4px solid #FFF3C9;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:2;
animation:rpPulse 1.8s ease-in-out infinite}
.rp-open:hover{transform:translateX(-50%) scale(1.08)}
@keyframes rpPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
.rp-code-line{font-size:12px;color:#FFE9C8;margin-top:0;padding:9px 12px 13px;background:#E02020;cursor:pointer;word-break:break-all}
.rp-tb-btn{margin:10px 14px 0;padding:12px 0;border-radius:999px;text-align:center;cursor:pointer;
background:linear-gradient(180deg,#FFD24A,#FF9A1F);color:#B01F14;font-size:16px;font-weight:800;
letter-spacing:1px;box-shadow:0 4px 14px rgba(255,140,0,.45);animation:rpBtnPulse 1.8s ease-in-out infinite}
.rp-tb-btn:active{transform:scale(.97)}
@keyframes rpBtnPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.rp-guide{padding:11px 14px 15px;background:#E02020;color:#FFE9C8;font-size:12px;line-height:1.8;text-align:center}
.rp-guide b{color:#FFE14D}
.rp-tpwd{display:inline-block;margin-top:5px;padding:4px 12px;border-radius:10px;background:rgba(0,0,0,.2);
color:#fff;font-size:13px;letter-spacing:1px;user-select:all;cursor:pointer}
.rp-code-line:hover{color:#fff}
.rp-time{font-size:11px;opacity:.85;margin-top:10px}
@media (max-width:360px){#rpBox{width:258px}}
@media (max-height:600px){.rp-img{max-height:52vh}}
@media (orientation:landscape) and (max-height:520px){#rpBox{width:240px}.rp-img{max-height:46vh}}
.rp-x{position:absolute;top:8px;right:10px;width:30px;height:30px;border-radius:50%;
background:rgba(0,0,0,.32);color:#fff;font-size:19px;line-height:29px;text-align:center;cursor:pointer;z-index:2}
.rp-x:hover{background:rgba(0,0,0,.5)}
@media(max-width:380px){.rp-big{font-size:26px}}
/* 福利行式布局（学好单库聚合页：图+标题+领券省X元+到手价划线原价+去抢购） */
#list.wflist{display:block;max-width:860px;margin:0 auto}
.wf-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;
border:1px solid #EEF1F6;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(17,55,178,.04)}
.wf-thumb{width:72px;height:72px;flex-shrink:0;border-radius:8px;overflow:hidden;background:#f7f8fa}
.wf-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.wf-mid{flex:1;min-width:0}
.wf-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.wf-price{color:#E12319;font-weight:800;font-size:20px;line-height:1.1;white-space:nowrap}
.wf-price i{font-size:11px;font-style:normal;font-weight:600;margin-right:2px}
.wf-price s{color:#9aa0a8;font-size:12px;font-weight:400;margin-left:5px}
.wf-btn{display:inline-block;background:#1F8A44;color:#fff;font-size:13px;font-weight:600;
padding:7px 18px;border-radius:999px;text-decoration:none;transition:.18s}
.wf-btn:hover{background:#16693A}
@media(max-width:520px){.wf-thumb{width:60px;height:60px}.wf-price{font-size:17px}.wf-btn{padding:6px 14px}}

/* ---------- 实时状态条 ---------- */
.rtbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;
margin:14px 0 4px;padding:13px 18px;border:1px solid #EBEFF7;border-radius:14px;
box-shadow:0 2px 10px rgba(17,55,178,.05)}
.rt-live{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:#E12319}
.rt-dot{width:8px;height:8px;border-radius:50%;background:#E12319;animation:rtpulse 1.8s infinite}
@keyframes rtpulse{0%{box-shadow:0 0 0 0 rgba(225,35,25,.45)}70%{box-shadow:0 0 0 8px rgba(225,35,25,0)}
100%{box-shadow:0 0 0 0 rgba(225,35,25,0)}}
.rt-sep{width:1px;height:16px;background:#E6EAF2}
.rt-txt{font-size:14px;color:#6b7280}
.rt-num{display:inline-block;color:#FFD98A;font-weight:700;font-size:14px;background:#212121;
padding:1px 9px;margin:0 5px;border-radius:6px;vertical-align:middle;letter-spacing:.5px}
.rt-refresh{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:7px 20px;
border:1px solid #FFC9C4;border-radius:999px;color:#E12319;background:#FFF7F6;
font-size:13px;font-weight:600;cursor:pointer;transition:.18s}
.rt-refresh:hover{background:#E12319;color:#fff;border-color:#E12319;box-shadow:0 4px 12px rgba(225,35,25,.25)}
.rt-refresh::before{content:"";width:12px;height:12px;border:1.6px solid currentColor;
border-top-color:transparent;border-radius:50%;display:inline-block}
@media(max-width:780px){.rt-refresh{margin-left:0}}

/* ---------- 卡片网格 ---------- */
.report-list{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:12px}
@media(max-width:1100px){.report-list{grid-template-columns:repeat(3,1fr)}}
@media(max-width:780px){.report-list{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(max-width:420px){.report-list{grid-template-columns:repeat(2,1fr);gap:8px}}

.report-item{background:var(--card);border-radius:8px;box-shadow:var(--shadow);
display:flex;flex-direction:column;overflow:hidden;transition:transform .26s,box-shadow .26s;cursor:pointer}
.report-item:hover{transform:translateY(-6px);box-shadow:0 16px 38px 0 rgba(17,55,178,.18);z-index:5}
/* 触摸设备：禁长按系统选择菜单，让位给「长按 0.55s 复制」（Boss 2026-10-28 明令） */
@media(hover:none){.report-item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
.image-section{position:relative;background:#f7f8fa}
.image-section img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.image-section .noimg{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
color:#c8ccd4;font-size:12px}

.content-section{position:relative;flex:1;display:flex;flex-direction:column}
.content-section-item{padding:11px 13px 8px;flex:1;display:flex;flex-direction:column}
.price{color:var(--jd);font-size:22px;font-weight:800;line-height:1.2;margin-bottom:6px}
.price i{font-size:13px;font-style:normal;font-weight:600}
.price s{color:#b6bbc3;font-size:12px;font-weight:400;margin-left:6px}
.content-box{font-size:13px;line-height:1.8;color:#34373d;word-break:break-word;
max-height:196px;overflow:hidden;transition:max-height .3s}
.report-item:hover .content-box{max-height:640px}
.content-box .ct{white-space:pre-line}
.content-box .ct .pj{color:var(--jd);font-weight:800;font-size:17px}
.content-box a.lnk{display:block;font-size:12px;line-height:1.7;color:#3C6FE8;
word-break:break-all;margin:1px 0;text-decoration:none}
.content-box a.lnk:hover{color:var(--jd);text-decoration:underline}
.content-box a.lnki{color:#3C6FE8;word-break:break-all;text-decoration:none}
.content-box a.lnki:hover{color:var(--jd);text-decoration:underline}

.content-section-info{margin-top:auto;padding-top:8px;min-height:38px;display:flex;
justify-content:space-between;align-items:center;border-top:1px solid #F0F1F4}
.attr{display:flex;align-items:center;gap:6px}
.pf{width:20px;height:20px;border-radius:3px;font-size:11px;color:#fff;font-weight:600;
display:flex;align-items:center;justify-content:center}
.pf.jd{background:var(--jd)}.pf.tb{background:var(--tb)}.pf.fz{background:var(--fz)}.pf.pdd{background:#e02e24}.pf.ot{background:#a6abb3}
.reltime{color:#9aa0a8;font-size:12px;margin-left:2px}

/* 淘宝卡：左内容右图片（学大淘客排版，有几张图用几张） */
.tb-wrap{display:flex;flex:1;min-height:0}
.tb-left{flex:1;min-width:0;display:flex;flex-direction:column;padding:11px 10px 8px 13px}
.tb-right{width:92px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;
background:#f7f8fa;border-left:1px solid #F0F1F4;
max-height:196px;overflow:hidden;transition:max-height .3s}
.report-item:hover .tb-right{max-height:1200px}  /* 悬停全展开，折叠幅度与左侧文案(196px)一致 */
.tb-right img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.tb-right .noimg{flex:1;min-height:60px;display:flex;align-items:center;justify-content:center;
color:#c8ccd4;font-size:11px}
@media(max-width:420px){.tb-right{width:70px}}

/* 淘宝卡底角【复制链接】+ 图片灯箱 */
.cpylink{margin-left:auto;font-size:11px;color:#3C6FE8;cursor:pointer;white-space:nowrap;
padding:2px 9px;border:1px solid #D9DFED;border-radius:10px}
.cpylink:hover{color:var(--jd);border-color:var(--jd)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;z-index:98;
cursor:zoom-out;align-items:center;justify-content:center}
#lightbox.show{display:flex}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}

.more{margin:26px auto 0;width:150px;height:34px;line-height:34px;text-align:center;color:#8d939b;
font-size:13px;background:#fff;border-radius:17px;box-shadow:var(--shadow);cursor:pointer}
.more:hover{color:var(--brand)}
.empty{display:none;text-align:center;color:#9aa0a8;font-size:14px;padding:60px 0}
footer{padding:26px 20px 34px;text-align:center;color:#a8aeb6;font-size:12px;line-height:1.9}

#toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(8px);background:#212121;
color:#fff;padding:10px 20px;border-radius:22px;font-size:14px;opacity:0;transition:.28s;
pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#top{position:fixed;right:24px;bottom:34px;width:44px;height:44px;border-radius:50%;
background:linear-gradient(90deg,#FF7D00,#FF0A00);color:#fff;border:0;font-size:20px;cursor:pointer;
box-shadow:0 4px 14px rgba(255,45,0,.35);display:none;z-index:30}
/* ---------- 双11红包轮播 banner（2026-10-16 Boss 明令，加大+强化领取CTA） ---------- */
.hb-banner{position:relative;overflow:hidden;max-width:1230px;margin:10px auto 0;padding:0 20px}
@media(max-width:640px){.hb-banner{padding:0 10px;margin-top:8px}}
.hb-track{display:flex;transition:transform .45s ease}
.hb-slide{flex:0 0 100%;display:flex;align-items:center;gap:14px;height:92px;padding:0 24px;
border-radius:14px;color:#fff;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
box-shadow:0 6px 18px rgba(255,60,0,.25)}
.hb-jd{background:linear-gradient(90deg,#E12319,#FF6A00)}
.hb-tb{background:linear-gradient(90deg,#FF5000,#FF8F1F)}
.hb-tag{background:rgba(255,255,255,.22);border-radius:9px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.hb-txt{display:flex;flex-direction:column;line-height:1.4}
.hb-main{font-size:22px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.hb-sub{font-size:13px;opacity:.94;white-space:nowrap}
.hb-cta{margin-left:auto;background:#fff;border-radius:999px;padding:9px 20px;font-size:16px;font-weight:800;
white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.18);animation:hbPulse 1.5s ease-in-out infinite}
.hb-jd .hb-cta{color:#E12319}
.hb-tb .hb-cta{color:#FF5000}
@keyframes hbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media(max-width:640px){.hb-slide{height:76px;padding:0 16px;border-radius:12px}
.hb-main{font-size:18px}.hb-sub{font-size:11px}.hb-tag{font-size:12px;padding:3px 8px}
.hb-cta{padding:7px 14px;font-size:14px}}
.hb-dots{position:absolute;right:28px;bottom:7px;display:flex;gap:5px;pointer-events:none}
.hb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.hb-dot.on{background:#fff}
</style>
</head>
<body>

<div class="hb-banner">
  <div class="hb-track" id="hbTrack">
    <a class="hb-slide hb-jd" href="javascript:;" id="hbJD">
      <span class="hb-tag">京东双11</span>
      <span class="hb-txt"><span class="hb-main">京享红包 天天可领</span><span class="hb-sub">领了再下单，立省一笔</span></span>
      <span class="hb-cta">立即领取</span>
    </a>
    <a class="hb-slide hb-tb" href="javascript:;" id="hbTB">
      <span class="hb-tag">淘宝双11</span>
      <span class="hb-txt"><span class="hb-main">超级红包 限时加码</span><span class="hb-sub">口令自动复制，打开淘宝即领</span></span>
      <span class="hb-cta">去领取</span>
    </a>
  </div>
  <div class="hb-dots"><i class="hb-dot on"></i><i class="hb-dot"></i></div>
</div>

<script>
(function(){
  var JD_URL='https://u.jd.com/FDFQoBI';
  var TB_LAND='https://m.tb.cn/h.jXgUEoC';
  var TB_KOULING='77￥ HU926 6FiQTthHJE8￥';
  // 点击统计（Boss 2026-10-25 明令）：sendBeacon 静默上报，Function 写 KV 计数
  window.stat=function(e){try{navigator.sendBeacon('/api/click?e='+encodeURIComponent(e));}catch(_){}}
  // 页面访问统计（Boss 2026-10-28 明令）：visit=PV，uv 按「天」本地去重（localStorage 标记）
  stat('visit');
  try{var _uvd=new Date().toISOString().slice(0,10);if(localStorage.getItem('uvd')!==_uvd){localStorage.setItem('uvd',_uvd);stat('uv');}}catch(_){}
  function isWX(){return /MicroMessenger/i.test(navigator.userAgent);}
  function isMobile(){return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);}
  function legacyCopy(t){
    try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}catch(e){}
  }
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).catch(function(){legacyCopy(t);});
    }else{legacyCopy(t);}
  }
  function toastMsg(m){
    var el=document.getElementById('toast');if(!el){alert(m);return;}
    el.textContent=m;el.classList.add('show');
    setTimeout(function(){el.classList.remove('show');},2200);
  }
  document.getElementById('hbJD').addEventListener('click',function(){
    stat('banner_jd');

    // 悦拜短链保护版（Boss 2026-09-11）：整段用 _siteContext 渲染，不再从 list[]
    // 直出裸 u.jd.com 链接行。独立成行的 URL 渲染为链接，其余为文案
    d._siteContext.split('\n').forEach(ln=>{
      const s = ln.trim();
      const mStart = s.match(/^https?:\/\/[^\s"'，。；、）】]+/);
      if(mStart){
        const u = mStart[0];
        if(!seenLink[u]){ seenLink[u]=1;
          body.push('<a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>'); }
        const rest = s.slice(u.length).trim();
        if(rest) body.push('<div class="ct">'+escWithLinks(rest)+'</div>');  // 链接后跟的尾巴文字不丢
      } else if(ln){
        let t = escWithLinks(ln);  // 行中链接也转可点（修复券链灰色不可点，Boss 2026-09-12）
        // 仅京东：元前数字（如 10.9元）放大+红
        if(d.platform==='2') t = t.replace(/(\d+(?:\.\d+)?)元/g, '<span class="pj">$1元<\/span>');
        body.push('<div class="ct">'+t+'</div>');
      }
    });
  } else {
  (d.list||[]).forEach(it=>{
    if(it.content){
      let t = escWithLinks(it.content);  // 行中链接也转可点
      // 仅京东：元前数字（如 10.9元）放大+红
      if(d.platform==='2') t = t.replace(/(\d+(?:\.\d+)?)元/g, '<span class="pj">$1元<\/span>');
      body.push('<div class="ct">'+t+'</div>');
    }
    const c = pickCoupon(it);
    if(c && !seenLink[c]){ seenLink[c]=1;
      body.push('<a class="lnk" href="'+esc(c)+'" target="_blank" rel="noopener">'+esc(c)+'</a>'); }
    // 商品链接位：原始 item_id 是链接的条目，渲染转链后的链接（去重按 URL）
    if(it.item_id && /^https?:\/\//i.test(it.item_id)){
      const u = (it.url && /^https?:\/\//i.test(it.url)) ? it.url : it.item_id;
      if(u && !seenLink[u]){ seenLink[u]=1;
        body.push('<a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>'); }
    }
  });
  // 兜底：有转链链接但原始数据没有商品链接位（纯券线报转出来的）
  {
    const u = ((d.list||[]).map(it=>it.url).find(x=>x && /^https?:\/\//i.test(x))) || '';
    if(u && !seenLink[u]){
      body.push('<a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a>');
    }
  }
  } // end else（非短链保护版才从 list[] 直出链接）
  const box = '<div class="content-box">'+(body.length?body.join(''):'<div class="ct">（无文案）</div>')+'</div>';
  const info = '<div class="content-section-info">'
    + '<div class="attr"><span class="pf '+pfCls(d.platform)+'">'+pfTxt(d.platform)+'</span>'
    + '<span class="reltime">'+esc(rel(d._addedAt || d.time))+'</span></div>'
    + '</div>';

  // 淘宝卡：左边线报内容、右边图片（有几张图用几张），学大淘客排版；底角【复制链接】
  if(d.platform === '1'){
    const imgs = (d.images && d.images.length) ? d.images : [];
    const right = imgs.length
      ? imgs.map(u=>'<img src="'+esc(u)+'" referrerpolicy="no-referrer" loading="lazy" alt="">').join('')
      : '<div class="noimg">暂无图片</div>';
    const infoTb = '<div class="content-section-info">'
      + '<div class="attr"><span class="pf '+pfCls(d.platform)+'">'+pfTxt(d.platform)+'</span>'
      + '<span class="reltime">'+esc(rel(d._addedAt || d.time))+'</span></div>'
      + '<a class="cpylink" href="javascript:;" title="复制完整文案">复制文案</a>'
      + '</div>';
    return '<div class="report-item" data-plat="'+esc(d.platform)+'" data-text="'+esc(copyTextOf(d))+'" data-link="'+esc(linkOf(d))+'">'
      + '<div class="tb-wrap">'
      +   '<div class="tb-left">'+priceHtml+box+infoTb+'</div>'
      +   '<div class="tb-right">'+right+'</div>'
      + '</div></div>';
  }

  // 京东等其他平台：上图下文
  const img = (d.images && d.images.length)
    ? '<img src="'+esc(d.images[0])+'" referrerpolicy="no-referrer" loading="lazy" alt="">'
    : '<div class="noimg">暂无图片</div>';
  return '<div class="report-item" data-plat="'+esc(d.platform)+'" data-text="'+esc(copyTextOf(d))+'">'
    + '<div class="image-section">'+img+'</div>'
    + '<div class="content-section">'
    +   '<div class="content-section-item">'
    +     priceHtml + box + info
    +   '</div>'
    + '</div>'
    + '</div>';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t.__h); t.__h = setTimeout(()=>t.classList.remove('show'), 1300);
}
function copy(str, tip){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(str).then(()=>toast(tip||'已复制 ✓'), ()=>fallback(str, tip));
  } else fallback(str, tip);
}
function fallback(str, tip){
  const ta = document.createElement('textarea');
  ta.value = str; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(tip||'已复制 ✓'); }catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

  if(tp){
    e.stopPropagation(); e.preventDefault();
    copy(tp.dataset.tpwd || '', '口令已复制，打开淘宝App粘贴 ✓');
    return;
  }
  const c = e.target.closest('.cpylink');
  if(c){
    e.stopPropagation(); e.preventDefault();
    const card = c.closest('.report-item');
    stat('copy');
    copy((card && card.dataset.text) || '', '文案已复制 ✓');
    return;
  }
  // 图片点击放大（灯箱），点空白处关闭
  if(e.target.tagName==='IMG' && e.target.closest('.report-item')){
    e.stopPropagation(); e.preventDefault();
    const lb = document.getElementById('lightbox');
    lb.innerHTML = '<img src="'+e.target.src+'" referrerpolicy="no-referrer" alt="">';
    lb.classList.add('show');
  }
});
document.getElementById('lightbox').addEventListener('click', function(){
  this.classList.remove('show');
});
document.getElementById('more').onclick = ()=>render(false);

const topBtn = document.getElementById('top');
window.addEventListener('scroll', ()=>{
  topBtn.style.display = window.scrollY > 500 ? 'block' : 'none';
  if(window.innerHeight + window.scrollY > document.body.offsetHeight - 800){
    if(document.getElementById('more').style.display === 'block') render(false);
  }
});
topBtn.onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});

// 平台筛选：京东第一、淘宝第二、拼多多第三，不要「全部」分类
const PNAME = {'1':'淘宝','2':'京东','3':'飞猪','4':'拼多多'};
const PORDER = ['2','1','4'];
function buildPlat(){
  // Boss 2026-11-12：拼多多从网站删除；类目=低价好物|实时线报，平台均为 京东/淘宝
  const arr = (cat === 'lowprice') ? [['jd','京东'],['tb','淘宝']] : [['jd','京东'],['tb','淘宝']];
  document.getElementById('plat').innerHTML = arr.map(p=>
    '<li data-p="'+p[0]+'"'+(p[0]===filter?' class="active"':'')+'>'+p[1]+'</li>').join('');
}
buildPlat();
render(true);
updateTs(); // 首屏立即用内嵌数据校准「截止」，不等接口返回

// 刷新 = 从 KV 接口拉最新数据、重绘当前平台（不整页 reload，不重置分类）
function refreshData(){
  return fetch('/api/deals?ts='+Date.now(), {cache:'no-store'})
    .then(r=>r.ok ? r.json() : null)
    .then(fresh=>{
      if(!Array.isArray(fresh) || !fresh.length) return false;
      const oldTop = DEALS.length ? String(DEALS[0].id) : '';
      const newTop = String(fresh[0].id||'');
      const changed = (newTop !== oldTop) || fresh.length !== DEALS.length;
      DEALS = fresh;
      buildPlat();
      render(true);
      if(cat === 'lowprice') renderLowprice(true);  // 低价好物：刷新时强制重拉当前子分类 KV
      updateTs();
      return changed;
    })
    .catch(()=>false);
}
function updateTs(){ // 顶部「截止」= 当前数据最新一条的线报时间（真实数据截止点，不是页面打开时刻）
  const ts = document.querySelector('.rt-num');
  const t = DEALS.length ? String(DEALS[0].time||'') : '';
  if(ts) ts.textContent = t.length >= 16 ? t.slice(11,16) : new Date().toTimeString().slice(0,5);
}
// 防御：元素缺失也不许炸掉后续脚本（上次就是这里 null 报错把首屏刷新带死的）
const btnRefreshEl = document.getElementById('btnRefresh');
if(btnRefreshEl){
  btnRefreshEl.onclick = function(){
    const a = this; a.textContent = '刷新中…';
    refreshData().then(c=>{
      a.textContent = '刷新';
      toast(c ? '已更新到最新线报 ✓' : '已是最新');
    });
  };
}
// 首屏渲染后自动拉一次最新数据（截止时间由 updateTs 在 refreshData 内同步）
refreshData();
</script>
